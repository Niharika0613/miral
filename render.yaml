services:
  - type: web
    name: miral-ai
    env: python
    buildCommand: "npm install && npm run build && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.14.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./miral.db
      - key: SECRET_KEY
        generateValue: true
